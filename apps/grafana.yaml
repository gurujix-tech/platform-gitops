# Argo CD Application: Grafana on kind (Phase 6c)
#
# UI for Prometheus metrics. Datasource + service-orders dashboard are provisioned from ConfigMaps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/gurujix-tech/platform-gitops.git
    targetRevision: HEAD
    path: observability/grafana

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
