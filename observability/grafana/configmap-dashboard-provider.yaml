# Tells Grafana to load dashboard JSON from a directory (file provider).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: gurujix-platform
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: gurujix
        orgId: 1
        folder: Gurujix
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
