# Phase 6c: starter dashboard for service-orders (PromQL panels).
# Edit in UI later is fine for learning; this file keeps Git as the baseline.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-orders
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: gurujix-platform
data:
  service-orders.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            {
              "expr": "rate(http_requests_total{job=\"service-orders\",handler!~\"/health|/ready\"}[1m])",
              "legendFormat": "{{method}} {{handler}} {{status}}",
              "refId": "A"
            }
          ],
          "title": "HTTP request rate (exclude probes)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            {
              "expr": "orders_created_total{job=\"service-orders\"}",
              "legendFormat": "orders_created_total",
              "refId": "A"
            }
          ],
          "title": "Orders created (counter)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{job=\"service-orders\",handler!~\"/health|/ready\"}[5m])))",
              "legendFormat": "p95 {{handler}}",
              "refId": "A"
            }
          ],
          "title": "HTTP latency p95 (exclude probes)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Prometheus rule state via ALERTS series (1 = firing). No Alertmanager required.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "color": "green", "index": 0, "text": "OK" } }, "type": "value" },
                { "options": { "1": { "color": "red", "index": 1, "text": "FIRING" } }, "type": "value" }
              ],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "max(ALERTS{alertname=\"ServiceOrdersDown\",alertstate=\"firing\"}) or vector(0)",
              "legendFormat": "ServiceOrdersDown",
              "refId": "A"
            }
          ],
          "title": "ServiceOrdersDown alert",
          "type": "stat"
        }
      ],
      "schemaVersion": 39,
      "tags": ["gurujix", "service-orders"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "service-orders",
      "uid": "service-orders",
      "version": 1
    }
